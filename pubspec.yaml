name: number_gravity
description: Number Gravity - A deterministic turn-based gravity puzzle game.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.2
  flame: ^1.37.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  in_app_purchase: ^3.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^2.1.0
  uuid: ^4.5.3
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/levels/
    - assets/images/
    - assets/images/how-to-play/
