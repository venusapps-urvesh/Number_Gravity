name: number_gravity
description: Number Gravity - A deterministic turn-based gravity puzzle game.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flame: ^1.23.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  google_mobile_ads: ^5.3.0
  in_app_purchase: ^3.2.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  share_plus: ^10.1.4
  firebase_core: ^3.13.0
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  firebase_remote_config: ^5.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/levels/
    - assets/images/
